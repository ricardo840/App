<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Color Palette Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#e68c4c",
              "background-light": "#f8f7f6",
              "background-dark": "#211811",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#1b130e] dark:text-white min-h-screen">
<div class="max-w-md mx-auto min-h-screen flex flex-col relative">
<!-- TopAppBar -->
<div class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-2 justify-between">
<div class="text-[#1b130e] dark:text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined cursor-pointer">arrow_back_ios</span>
</div>
<h2 class="text-[#1b130e] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Color Palette</h2>
<div class="size-12"></div> <!-- Spacer for balance -->
</div>
<div class="flex-1 overflow-y-auto pb-32">
<!-- SectionHeader: Preview -->
<div class="px-4 pt-5">
<h2 class="text-[#1b130e] dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em]">Preview</h2>
<p class="text-[#956d50] dark:text-[#c0a08a] text-sm mt-1">See how the app will look for your child.</p>
</div>
<!-- Card: Live Preview -->
<div class="p-4 @container">
<div class="flex flex-col items-stretch justify-start rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] bg-white dark:bg-[#2d2118] overflow-hidden border border-[#e6dad1] dark:border-[#3d2d21]">
<div class="w-full bg-[#f0f9ff] dark:bg-[#1e293b] aspect-video flex flex-col items-center justify-center p-8 gap-4 transition-colors duration-500">
<!-- Abstract "A is for Apple" Graphic -->
<div class="size-32 rounded-full bg-white dark:bg-gray-800 shadow-sm flex items-center justify-center text-7xl font-bold text-[#0ea5e9]">A</div>
<div class="h-12 w-48 bg-[#0ea5e9]/20 rounded-full flex items-center justify-center">
<span class="text-[#0ea5e9] font-bold text-lg">Apple</span>
</div>
</div>
<div class="flex w-full min-w-72 grow flex-col items-stretch justify-center gap-1 py-4 px-4">
<p class="text-[#1b130e] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Learn Letters</p>
<div class="flex items-end gap-3 justify-between">
<p class="text-[#956d50] dark:text-[#c0a08a] text-base font-normal leading-normal">Alphabet activity module</p>
</div>
</div>
</div>
</div>
<!-- SectionHeader: Themes -->
<div class="px-4 pt-5 pb-3">
<h2 class="text-[#1b130e] dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em]">Choose a Theme</h2>
<p class="text-[#956d50] dark:text-[#c0a08a] text-sm mt-1">Calm colors help with focus and learning.</p>
</div>
<!-- RadioList: Custom Theme Selection -->
<div class="flex flex-col gap-3 p-4">
<!-- Ocean -->
<label class="group relative flex flex-col gap-3 p-4 rounded-xl border border-[#e6dad1] dark:border-[#3d2d21] bg-white dark:bg-[#2d2118] cursor-pointer has-[:checked]:border-primary has-[:checked]:border-2 transition-all">
<input checked="" class="invisible absolute" name="theme-selection" type="radio"/>
<div class="flex items-center justify-between w-full">
<div class="flex flex-col">
<span class="text-base font-bold text-[#1b130e] dark:text-white">Ocean</span>
<span class="text-sm text-[#956d50] dark:text-[#c0a08a]">Deep blues and teals</span>
</div>
<div class="flex gap-2">
<div class="size-8 rounded-full bg-[#0ea5e9] border-2 border-white dark:border-[#2d2118]"></div>
<div class="size-8 rounded-full bg-[#0c4a6e] border-2 border-white dark:border-[#2d2118]"></div>
<div class="size-8 rounded-full bg-[#e0f2fe] border-2 border-white dark:border-[#2d2118]"></div>
</div>
</div>
</label>
<!-- Forest -->
<label class="group relative flex flex-col gap-3 p-4 rounded-xl border border-[#e6dad1] dark:border-[#3d2d21] bg-white dark:bg-[#2d2118] cursor-pointer has-[:checked]:border-primary has-[:checked]:border-2 transition-all">
<input class="invisible absolute" name="theme-selection" type="radio"/>
<div class="flex items-center justify-between w-full">
<div class="flex flex-col">
<span class="text-base font-bold text-[#1b130e] dark:text-white">Forest</span>
<span class="text-sm text-[#956d50] dark:text-[#c0a08a]">Soft greens and earth tones</span>
</div>
<div class="flex gap-2">
<div class="size-8 rounded-full bg-[#166534] border-2 border-white dark:border-[#2d2118]"></div>
<div class="size-8 rounded-full bg-[#4ade80] border-2 border-white dark:border-[#2d2118]"></div>
<div class="size-8 rounded-full bg-[#f0fdf4] border-2 border-white dark:border-[#2d2118]"></div>
</div>
</div>
</label>
<!-- Sunset -->
<label class="group relative flex flex-col gap-3 p-4 rounded-xl border border-[#e6dad1] dark:border-[#3d2d21] bg-white dark:bg-[#2d2118] cursor-pointer has-[:checked]:border-primary has-[:checked]:border-2 transition-all">
<input class="invisible absolute" name="theme-selection" type="radio"/>
<div class="flex items-center justify-between w-full">
<div class="flex flex-col">
<span class="text-base font-bold text-[#1b130e] dark:text-white">Sunset</span>
<span class="text-sm text-[#956d50] dark:text-[#c0a08a]">Warm oranges and purples</span>
</div>
<div class="flex gap-2">
<div class="size-8 rounded-full bg-[#e68c4c] border-2 border-white dark:border-[#2d2118]"></div>
<div class="size-8 rounded-full bg-[#7c3aed] border-2 border-white dark:border-[#2d2118]"></div>
<div class="size-8 rounded-full bg-[#fff7ed] border-2 border-white dark:border-[#2d2118]"></div>
</div>
</div>
</label>
<!-- Clouds -->
<label class="group relative flex flex-col gap-3 p-4 rounded-xl border border-[#e6dad1] dark:border-[#3d2d21] bg-white dark:bg-[#2d2118] cursor-pointer has-[:checked]:border-primary has-[:checked]:border-2 transition-all">
<input class="invisible absolute" name="theme-selection" type="radio"/>
<div class="flex items-center justify-between w-full">
<div class="flex flex-col">
<span class="text-base font-bold text-[#1b130e] dark:text-white">Clouds</span>
<span class="text-sm text-[#956d50] dark:text-[#c0a08a]">Light greys and sky blues</span>
</div>
<div class="flex gap-2">
<div class="size-8 rounded-full bg-[#94a3b8] border-2 border-white dark:border-[#2d2118]"></div>
<div class="size-8 rounded-full bg-[#cbd5e1] border-2 border-white dark:border-[#2d2118]"></div>
<div class="size-8 rounded-full bg-[#f8fafc] border-2 border-white dark:border-[#2d2118]"></div>
</div>
</div>
</label>
</div>
</div>
<!-- Sticky Bottom Action Button -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light dark:via-background-dark to-transparent pt-10">
<button class="w-full bg-primary text-white font-bold py-4 rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all">
                Apply Theme
            </button>
</div>
</div>
</body></html>
