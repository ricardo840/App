<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Association Activity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e68c4c",
                        "background-light": "#fbfaf8",
                        "background-dark": "#211811",
                        "soft-yellow": "#FFF9E6",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: max(884px, 100dvh);
        }
        .matching-line {
            position: absolute;
            height: 4px;
            background-color: #e68c4c;
            transform-origin: left center;
            z-index: 0;
            opacity: 0.6;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col overflow-hidden">
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<button class="text-primary flex size-12 shrink-0 items-center justify-center hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-size: 32px;">arrow_back_ios_new</span>
</button>
<h2 class="text-[#1b130e] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center">3/10</h2>
<div class="size-12"></div> 
</header>
<div class="px-8 py-2">
<div class="flex flex-col gap-2">
<div class="rounded-full bg-[#e6dad1] dark:bg-zinc-700 h-3 overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 30%;"></div>
</div>
</div>
</div>
<main class="flex-1 flex flex-col items-center justify-center p-6 space-y-12">
<h3 class="text-[#1b130e] dark:text-white tracking-tight text-3xl font-bold leading-tight text-center max-w-xs">
            Match the items to their colors
        </h3>
<div class="grid grid-cols-2 gap-8 w-fit mx-auto items-center justify-items-center">
<div class="group cursor-pointer flex flex-col items-center">
<div class="size-32 rounded-3xl bg-white dark:bg-zinc-800 shadow-sm border-4 border-transparent hover:border-primary/40 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[#FFB300]" style="font-size: 64px; font-variation-settings: 'FILL' 1;">light_mode</span>
</div>
</div>
<div class="flex items-center justify-center">
<label class="size-32 rounded-full border-4 border-white dark:border-zinc-700 ring-4 ring-transparent hover:ring-primary/20 shadow-md cursor-pointer transition-all flex items-center justify-center" style="background-color: #2196F3;">
<input class="invisible hidden" name="association-match" type="checkbox"/>
</label>
</div>
<div class="flex items-center justify-center">
<label class="size-32 rounded-full border-4 border-white dark:border-zinc-700 ring-4 ring-transparent hover:ring-primary/20 shadow-md cursor-pointer transition-all flex items-center justify-center" style="background-color: #FFEB3B;">
<input class="invisible hidden" name="association-match" type="checkbox"/>
</label>
</div>
<div class="group cursor-pointer flex flex-col items-center">
<div class="size-32 rounded-3xl bg-white dark:bg-zinc-800 shadow-sm border-4 border-transparent hover:border-primary/40 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[#90CAF9]" style="font-size: 64px; font-variation-settings: 'FILL' 1;">cloud</span>
</div>
</div>
</div>
</main>
<footer class="p-8 flex flex-col items-center">
<button class="w-full max-w-xs py-5 bg-primary/20 text-primary font-bold text-xl rounded-full hover:bg-primary/30 transition-colors">
            Check Answer
        </button>
<p class="mt-6 text-zinc-400 dark:text-zinc-500 text-sm font-medium uppercase tracking-widest">Tap to link pairs</p>
</footer>
<div class="fixed -bottom-24 -left-24 size-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed -top-24 -right-24 size-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>

</body></html>
