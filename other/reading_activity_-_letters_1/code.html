<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reading Activity - Letters</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400,100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e68c4c",
                        "background-light": "#f2f7f2", // Overridden for calm green pastel theme
                        "background-dark": "#1a1f1a",
                        "pastel-green": "#e8f5e9",
                        "accent-green": "#81c784"
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1.5rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between p-6 pb-2">
<button class="flex items-center justify-center size-12 bg-white dark:bg-zinc-800 rounded-full shadow-sm text-zinc-800 dark:text-zinc-100">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<div class="flex flex-col items-center flex-1">
<span class="text-zinc-500 dark:text-zinc-400 text-xs font-bold uppercase tracking-widest mb-1">Session</span>
<div class="flex gap-1.5">
<div class="h-2 w-6 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-zinc-300 dark:bg-zinc-700"></div>
<div class="h-2 w-2 rounded-full bg-zinc-300 dark:bg-zinc-700"></div>
<div class="h-2 w-2 rounded-full bg-zinc-300 dark:bg-zinc-700"></div>
<div class="h-2 w-2 rounded-full bg-zinc-300 dark:bg-zinc-700"></div>
</div>
</div>
<button class="flex items-center justify-center size-12 bg-white dark:bg-zinc-800 rounded-full shadow-sm text-zinc-800 dark:text-zinc-100">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</button>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-4">
<!-- Progress Bar (Internal Activity) -->
<div class="w-full max-w-sm mb-8">
<div class="flex justify-between items-end mb-2">
<p class="text-zinc-800 dark:text-zinc-100 text-lg font-bold">Activity Progress</p>
<p class="text-zinc-500 dark:text-zinc-400 text-sm font-medium">1 of 5</p>
</div>
<div class="h-4 w-full bg-zinc-200 dark:bg-zinc-800 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500" style="width: 20%;"></div>
</div>
</div>
<!-- Association Card -->
<div class="w-full max-w-sm bg-white dark:bg-zinc-900 rounded-xl p-8 shadow-xl shadow-zinc-200/50 dark:shadow-none mb-8 flex flex-col items-center">
<div class="flex items-center gap-10">
<div class="text-[120px] font-bold text-zinc-800 dark:text-zinc-100 leading-none">A</div>
<div class="w-32 h-32 rounded-xl bg-pastel-green dark:bg-zinc-800 flex items-center justify-center relative overflow-hidden">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Simple minimalist red apple illustration for kids" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAHY5L24ugB_g8E7bJNjhua19r98M7NIC5AqUJl96ZDD_Xod9M_wW0ERepBveC1l0zhnDkCEyJHihN3SlzvWof_UqFHu3K_-3kUzu29FZJJSozKFeqfIjSS_7dIIbiw-v8Cgrp2JFvXez1wGVv-wpTVcN8g82cB6B-43OLc1PmHhcXQyV-Mll-yX1UZUfAmm4NiowHI90Y7maLIS39cBDQpL5bo2RmtRDE5Sr4bls_gOqF2DMAa3uLGXCPMKBAT1yd8ju_sVaIpigI");'>
</div>
</div>
</div>
<p class="mt-6 text-zinc-400 dark:text-zinc-500 text-xl font-medium tracking-wide uppercase">Apple</p>
</div>
<!-- Instruction Text -->
<div class="text-center mb-10">
<h3 class="text-zinc-800 dark:text-zinc-100 text-3xl font-bold tracking-tight px-4">Find the letter <span class="text-primary underline decoration-4 underline-offset-8">A</span></h3>
</div>
<!-- Selection Interaction -->
<div class="w-full max-w-sm px-4">
<div class="flex gap-4 justify-between">
<!-- Choice 1 -->
<label class="relative flex-1 aspect-square cursor-pointer group">
<input class="peer absolute opacity-0 w-0 h-0" name="letter-choice" type="radio" value="B"/>
<div class="w-full h-full rounded-xl bg-white dark:bg-zinc-900 border-4 border-transparent flex items-center justify-center shadow-lg transition-all peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:scale-105">
<span class="text-4xl font-bold text-zinc-800 dark:text-zinc-100">B</span>
</div>
</label>
<!-- Choice 2 (Correct) -->
<label class="relative flex-1 aspect-square cursor-pointer group">
<input checked="" class="peer absolute opacity-0 w-0 h-0" name="letter-choice" type="radio" value="A"/>
<div class="w-full h-full rounded-xl bg-white dark:bg-zinc-900 border-4 border-transparent flex items-center justify-center shadow-lg transition-all peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:scale-105">
<span class="text-4xl font-bold text-zinc-800 dark:text-zinc-100">A</span>
<div class="absolute -top-3 -right-3 size-8 bg-primary rounded-full hidden peer-checked:flex items-center justify-center text-white shadow-md">
<span class="material-symbols-outlined text-xl">check</span>
</div>
</div>
</label>
<!-- Choice 3 -->
<label class="relative flex-1 aspect-square cursor-pointer group">
<input class="peer absolute opacity-0 w-0 h-0" name="letter-choice" type="radio" value="C"/>
<div class="w-full h-full rounded-xl bg-white dark:bg-zinc-900 border-4 border-transparent flex items-center justify-center shadow-lg transition-all peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:scale-105">
<span class="text-4xl font-bold text-zinc-800 dark:text-zinc-100">C</span>
</div>
</label>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="p-8 pb-12">
<button class="w-full bg-primary hover:bg-primary/90 text-white text-xl font-bold py-5 rounded-full shadow-xl shadow-primary/30 flex items-center justify-center gap-3 transition-transform active:scale-95">
            Next Level
            <span class="material-symbols-outlined">arrow_forward_ios</span>
</button>
</div>
<!-- Background Decoration (Subtle) -->
<div class="fixed top-20 -left-10 w-40 h-40 bg-accent-green/10 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-40 -right-10 w-60 h-60 bg-primary/10 rounded-full blur-3xl -z-10"></div>
</body></html>
