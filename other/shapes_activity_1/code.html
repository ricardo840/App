<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shapes Activity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#e68c4c",
                "background-light": "#f8f7f6",
                "background-dark": "#211811",
                "pastel-purple": "#f3f0ff",
                "deep-purple": "#5b4c99",
              },
              fontFamily: {
                "display": ["Plus Jakarta Sans"]
              },
              borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        body {
          min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-pastel-purple dark:bg-background-dark font-display text-[#1b130e] dark:text-white min-h-screen flex flex-col overflow-hidden">
<header class="p-6 relative z-10">
<div class="flex items-center justify-between mb-4">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-zinc-800 shadow-sm">
<span class="material-symbols-outlined text-deep-purple dark:text-white">close</span>
</button>
<div class="flex-1 px-8">
<div class="h-3 w-full bg-white dark:bg-zinc-800 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 60%;"></div>
</div>
</div>
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-zinc-800 shadow-sm">
<span class="material-symbols-outlined text-primary">stars</span>
</div>
</div>
</header>
<main class="flex-1 flex flex-col px-4 pb-12 relative overflow-hidden">
<div class="text-center pt-2 pb-6 relative z-10">
<h4 class="text-deep-purple/70 dark:text-primary/70 text-sm font-bold leading-normal tracking-[0.05em] uppercase mb-1">Visual Matching</h4>
<h2 class="text-deep-purple dark:text-white tracking-tight text-3xl font-bold leading-tight">Find the matching shape</h2>
</div>
<div class="flex-1 w-full bg-white/40 dark:bg-zinc-800/20 rounded-[3.5rem] relative flex flex-col items-center justify-center border-4 border-white/60 dark:border-zinc-700/30 shadow-inner">
<div class="flex-1 flex items-center justify-center w-full">
<div class="w-full max-w-[80%] aspect-square flex items-center justify-center">
<div class="w-full h-full max-w-[280px] max-h-[280px] rounded-full border-[16px] border-deep-purple dark:border-primary shadow-2xl bg-white/30 dark:bg-zinc-800/40"></div>
</div>
</div>
<button class="mb-24 flex items-center gap-2 px-6 py-3 bg-white/80 dark:bg-zinc-800/80 backdrop-blur-sm rounded-full shadow-md hover:scale-105 transition-transform z-10">
<span class="material-symbols-outlined text-deep-purple dark:text-primary">volume_up</span>
<span class="font-bold text-deep-purple dark:text-white">"Can you find the Circle?"</span>
</button>
<div class="absolute -bottom-8 left-0 right-0 flex justify-center gap-6 px-4">
<button class="w-20 h-20 bg-white/80 dark:bg-zinc-800/80 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg border-2 border-white dark:border-zinc-700 transition-transform active:scale-90 group">
<div class="w-8 h-8 border-4 border-deep-purple/40 dark:border-white/40 group-hover:border-primary rounded-sm transition-colors"></div>
</button>
<button class="w-20 h-20 bg-white/80 dark:bg-zinc-800/80 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg border-2 border-white dark:border-zinc-700 transition-transform active:scale-90 group">
<div class="w-0 h-0 border-l-[16px] border-l-transparent border-r-[16px] border-r-transparent border-b-[28px] border-b-deep-purple/40 dark:border-b-white/40 group-hover:border-b-primary transition-colors"></div>
</button>
<button class="w-24 h-24 bg-primary rounded-full flex items-center justify-center shadow-xl shadow-primary/30 ring-4 ring-white/50 transition-transform active:scale-95">
<div class="w-10 h-10 rounded-full border-4 border-white"></div>
</button>
</div>
</div>
</main>
<div class="fixed top-1/4 left-0 -translate-x-1/2 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[12rem]">pentagon</span>
</div>
<div class="fixed bottom-1/4 right-0 translate-x-1/2 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[12rem]">star</span>
</div>

</body></html>
