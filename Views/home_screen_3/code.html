<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Home Screen - Educational App</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#e68c4c",
              "background-light": "#fbfaf8",
              "background-dark": "#211811",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1.25rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 1,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-[#1b130e] dark:text-[#f3ece8]"
  >
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
      <header
        class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10"
      >
        <div class="w-10"></div>
        <h2
          class="text-[#1b130e] dark:text-[#f3ece8] text-xl font-extrabold leading-tight tracking-[-0.015em] flex-1 text-center"
        >
          Little Learners
        </h2>
        <div
          class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10"
        >
          <span class="material-symbols-outlined text-primary text-2xl"
            >stars</span
          >
        </div>
      </header>
      <main class="flex-1 flex flex-col items-center px-6 py-8">
        <div class="flex w-full flex-col gap-6 items-center mb-10">
          <div class="flex gap-4 flex-col items-center">
            <div class="relative">
              <div
                class="bg-primary/20 rounded-full w-44 h-44 flex items-center justify-center overflow-hidden border-4 border-white dark:border-[#2d221a] shadow-sm"
              >
                <div
                  class="bg-center bg-no-repeat aspect-square bg-contain w-36"
                  data-alt="A friendly simple rounded brown bear character smiling"
                  style="
                    background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDmEahGeCjVd4hE3Ulz21avq-iR3ug1ffu036eXNkDahJT-q13ioBpBdA5VseUzWgg5o1-RBGDpiWVLf0pUUr-mwO1lFdYI-eQORexVDKGRYgMRohtrjdok9Yej0hyvTyPopddL8vVUALLjOoxZT8G5b3lQiqIemsZQVFvxL4iEXFZKqfYYjY2-pWuzzrTyM4FG5WOVigZ-Tk0wrBm3iCN4OnmoUYH96F4_GAwBXVNAtO4qfJ6LoODKrBxpGp18uC3m-_3-QuIhbAM&quot;);
                  "
                ></div>
              </div>
              <div
                class="absolute -bottom-2 -right-2 bg-white dark:bg-[#2d221a] p-2 rounded-full shadow-md"
              >
                <span class="material-symbols-outlined text-primary text-3xl"
                  >sentiment_satisfied</span
                >
              </div>
            </div>
            <div class="flex flex-col items-center justify-center gap-1">
              <p
                class="text-[#1b130e] dark:text-white text-3xl font-extrabold leading-tight tracking-tight text-center"
              >
                Hi there!
              </p>
              <p
                class="text-[#956d50] dark:text-[#cbb09c] text-lg font-medium leading-normal text-center"
              >
                Let's learn something new today.
              </p>
            </div>
          </div>
        </div>
        <div class="w-full max-w-[400px] grid grid-cols-2 gap-4">
          <button
            onclick="window.location.href='../selection/code.html'"
            class="col-span-2 flex h-24 w-full cursor-pointer items-center justify-between overflow-hidden rounded-full bg-primary px-8 text-white shadow-lg active:scale-95 transition-transform duration-100"
          >
            <div class="flex items-center gap-4">
              <div
                class="flex h-14 w-14 items-center justify-center rounded-full bg-white/20"
              >
                <span class="material-symbols-outlined text-4xl"
                  >play_circle</span
                >
              </div>
              <span class="text-3xl font-extrabold tracking-wide uppercase"
                >Play</span
              >
            </div>
            <span class="material-symbols-outlined text-3xl opacity-50"
              >arrow_forward_ios</span
            >
          </button>
          <a
            href="../progress_screen/code.html"
            class="flex h-32 flex-col cursor-pointer items-center justify-center gap-3 overflow-hidden rounded-3xl bg-[#f3ece8] dark:bg-[#2d221a] px-4 text-[#1b130e] dark:text-white shadow-sm active:scale-95 transition-transform duration-100"
          >
            <div
              class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/20"
            >
              <span class="material-symbols-outlined text-primary text-3xl"
                >auto_graph</span
              >
            </div>
            <span class="text-lg font-bold tracking-tight text-center"
              >My Progress</span
            >
          </a>
          <a
            href="../character_customization/code.html"
            class="flex h-32 flex-col cursor-pointer items-center justify-center gap-3 overflow-hidden rounded-3xl bg-transparent border-2 border-[#f3ece8] dark:border-[#2d221a] px-4 text-[#956d50] dark:text-[#cbb09c] active:opacity-60 transition-opacity"
          >
            <div
              class="flex h-12 w-12 items-center justify-center rounded-full border-2 border-[#f3ece8] dark:border-[#2d221a]"
            >
              <span class="material-symbols-outlined text-2xl">settings</span>
            </div>
            <span class="text-lg font-bold text-center">Settings</span>
          </a>
        </div>
        <div class="mt-auto pt-10 pb-4 opacity-30"></div>
      </main>
    </div>
  </body>
</html>
