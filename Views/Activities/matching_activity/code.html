<!doctype html>

<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Shapes Activity</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet"
  />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#e68c4c",
            "background-light": "#f8f7f6",
            "background-dark": "#211811",
            "pastel-purple": "#f3f0ff",
            "deep-purple": "#5b4c99",
          },
          fontFamily: {
            display: ["Plus Jakarta Sans"],
          },
          borderRadius: {
            DEFAULT: "1rem",
            lg: "2rem",
            xl: "3rem",
            full: "9999px",
          },
        },
      },
    };
  </script>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body
  class="bg-pastel-purple dark:bg-background-dark font-display text-[#1b130e] dark:text-white min-h-screen flex flex-col"
>
  <!-- Header & Progress -->
  <header class="p-6">
    <div class="flex items-center justify-between mb-4">
      <button
        onclick="window.location.href='../../selection/code.html'"
        class="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-zinc-800 shadow-sm"
      >
        <span
          class="material-symbols-outlined text-deep-purple dark:text-white"
          >close</span
        >
      </button>
      <div class="flex-1 px-8">
        <div
          class="h-3 w-full bg-white dark:bg-zinc-800 rounded-full overflow-hidden"
        >
          <div
            class="h-full bg-primary rounded-full"
            style="width: 60%"
          ></div>
        </div>
      </div>
      <div
        class="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-zinc-800 shadow-sm"
      >
        <span class="material-symbols-outlined text-primary">stars</span>
      </div>
    </div>
  </header>
  <!-- Instructional Text -->
  <div class="text-center px-6 pt-4">
    <h4
      class="text-deep-purple/70 dark:text-primary/70 text-sm font-bold leading-normal tracking-[0.05em] uppercase mb-1"
    >
      Visual Matching
    </h4>
    <h2
      class="text-deep-purple dark:text-white tracking-tight text-3xl font-bold leading-tight"
    >
      Find the matching shape
    </h2>
  </div>
  <!-- Main Activity Area (Central Canvas) -->
  <main
    class="flex-1 flex flex-col items-center justify-center px-4 relative"
  >
    <!-- Target Shape Display -->
    <div
      class="w-64 h-64 bg-white/50 dark:bg-zinc-800/30 rounded-[4rem] flex items-center justify-center border-4 border-dashed border-deep-purple/20"
    >
      <div
        class="w-40 h-40 rounded-full border-[12px] border-deep-purple dark:border-primary shadow-lg"
      ></div>
    </div>
    <!-- Voice Prompt Icon -->
    <button
      class="mt-8 flex items-center gap-2 px-6 py-3 bg-white dark:bg-zinc-800 rounded-full shadow-sm hover:scale-105 transition-transform"
    >
      <span
        class="material-symbols-outlined text-deep-purple dark:text-primary"
        >volume_up</span
      >
      <span class="font-bold text-deep-purple dark:text-white"
        >"Can you find the Circle?"</span
      >
    </button>
  </main>
  <!-- Interaction Dock (Options) -->
  <footer class="p-8 pb-12">
    <div
      class="bg-white/60 dark:bg-zinc-800/60 backdrop-blur-md rounded-full p-4 flex justify-between gap-4 max-w-md mx-auto shadow-xl border border-white dark:border-zinc-700"
    >
      <!-- Option: Square -->
      <button
        class="flex-1 aspect-square bg-white dark:bg-zinc-700 rounded-full flex items-center justify-center hover:bg-primary/10 transition-colors group"
      >
        <div
          class="w-10 h-10 border-4 border-deep-purple/40 dark:border-white/40 group-hover:border-primary rounded-sm transition-colors"
        ></div>
      </button>
      <!-- Option: Triangle -->
      <button
        class="flex-1 aspect-square bg-white dark:bg-zinc-700 rounded-full flex items-center justify-center hover:bg-primary/10 transition-colors group"
      >
        <div
          class="w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-bottom-[36px] border-b-deep-purple/40 dark:border-b-white/40 group-hover:border-b-primary transition-colors"
          style="border-bottom-width: 36px; border-bottom-style: solid"
        ></div>
      </button>
      <!-- Option: Circle (Correct) -->
      <button
        class="flex-1 aspect-square bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/30 ring-4 ring-primary/20"
      >
        <div class="w-10 h-10 rounded-full border-4 border-white"></div>
      </button>
    </div>
  </footer>
  <!-- Decorative Elements (Minimalist) -->
  <div class="absolute top-1/4 left-10 opacity-10 pointer-events-none">
    <span class="material-symbols-outlined text-8xl">pentagon</span>
  </div>
  <div class="absolute bottom-1/4 right-10 opacity-10 pointer-events-none">
    <span class="material-symbols-outlined text-8xl">star</span>
  </div>
</body>
</html>
