<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bumbum - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#8BC34A", // Pastel Green from the banner
                        "background-light": "#FFFDF5", // Soft cream color
                        "background-dark": "#1A1A1A",
                        "soft-blue": "#A5D8FF",
                        "soft-orange": "#FFD19A"
                    },
                    fontFamily: {
                        display: ["Nunito", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1.5rem",
                    },
                },
            },
        };
    </script>
<style>
        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .progress-bar-fill {
            animation: fillProgress 3.5s ease-in-out forwards;
        }
        .bounce-slow {
            animation: bounce 3s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(-2%); }
            50% { transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display h-screen w-full flex flex-col items-center justify-between overflow-hidden">
<div class="h-12 w-full"></div>
<main class="flex-1 flex flex-col items-center justify-center px-8 w-full max-w-md">
<div class="relative w-full aspect-square flex items-center justify-center mb-12 bounce-slow">
<div class="absolute inset-0 bg-soft-orange/20 dark:bg-soft-orange/10 rounded-full blur-3xl scale-75"></div>
<img alt="Bumbum app logo featuring two cute lions and colorful text" class="relative w-full h-auto drop-shadow-xl z-10" src="image.png"/>
</div>
<div class="text-center space-y-4">
<h1 class="text-2xl md:text-3xl font-extrabold text-slate-700 dark:text-slate-100 tracking-tight">
                ¡Hola! Vamos a aprender juntos
            </h1>
<p class="text-slate-500 dark:text-slate-400 font-medium">
                Cargando diversión...
            </p>
</div>
</main>
<footer class="w-full max-w-md px-10 pb-20 flex flex-col items-center">
<div class="w-full h-4 bg-slate-200/50 dark:bg-slate-800 rounded-full overflow-hidden shadow-inner">
<div class="progress-bar-fill h-full bg-primary rounded-full shadow-[0_0_15px_rgba(139,195,74,0.4)]"></div>
</div>
<div class="h-2 mt-8"></div>
</footer>
<script>
        // Check for dark mode preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>

</body></html>
