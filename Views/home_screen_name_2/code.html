<!DOCTYPE html>
<html class="light" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Name Entry Home Screen - Educational App</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
    tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e68c4c",
                        "background-light": "#fbfaf8",
                        "background-dark": "#211811",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1.25rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            border-color: #e68c4c !important;
            box-shadow: 0 0 0 4px rgba(230, 140, 76, 0.1);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
  <body class="bg-background-light dark:bg-background-dark text-[#1b130e] dark:text-[#f3ece8]">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
            <div class="w-10"></div> 
            <h2 class="text-[#1b130e] dark:text-[#f3ece8] text-xl font-extrabold leading-tight tracking-[-0.015em] flex-1 text-center uppercase tracking-widest">
                Little Learners
            </h2>
            <div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10">
                <span class="material-symbols-outlined text-primary text-2xl">stars</span>
            </div>
        </header>
        <main class="flex-1 flex flex-col items-center justify-center px-6 py-8">
            <div class="flex w-full flex-col gap-8 items-center mb-12">
                <div class="flex gap-6 flex-col items-center">
                    <div class="relative">
                        <div class="bg-primary/20 rounded-full w-48 h-48 flex items-center justify-center overflow-hidden 
                        border-4 border-white dark:border-[#2d221a] shadow-sm">
                            <div class="bg-center bg-no-repeat aspect-square bg-contain w-40" 
                            data-alt="A friendly simple rounded brown bear character smiling" 
                            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDmEahGeCjVd4hE3Ulz21avq-iR3ug1ffu036eXNkDahJT-q13ioBpBdA5VseUzWgg5o1-RBGDpiWVLf0pUUr-mwO1lFdYI-eQORexVDKGRYgMRohtrjdok9Yej0hyvTyPopddL8vVUALLjOoxZT8G5b3lQiqIemsZQVFvxL4iEXFZKqfYYjY2-pWuzzrTyM4FG5WOVigZ-Tk0wrBm3iCN4OnmoUYH96F4_GAwBXVNAtO4qfJ6LoODKrBxpGp18uC3m-_3-QuIhbAM");'>
                        </div>
                    </div>
                    <div class="absolute -bottom-2 -right-2 bg-white dark:bg-[#2d221a] p-2 rounded-full shadow-md">
                        <span class="material-symbols-outlined text-primary text-3xl">sentiment_satisfied</span>
                    </div>
                </div>
            </div>
            <div class="w-full max-w-[400px] flex flex-col items-center gap-6">
                <div class="w-full flex flex-col gap-4">
                    <label class="text-[#1b130e] dark:text-white text-3xl font-extrabold leading-tight tracking-tight text-center" 
                    for="child-name">
                            What is your name?
                    </label>
                    <input class="w-full h-16 px-8 rounded-full border-2 border-[#f3ece8] dark:border-[#2d221a] bg-white dark:bg-[#1b130e] 
                    text-center text-xl font-medium focus:ring-0 transition-all duration-200" id="child-name" placeholder="Type here..." type="text"/>
                </div>
            </div>
        </div>
        <div class="w-full max-w-[400px] flex flex-col gap-5">
            <button onclick="window.location.href='../character_customization/code.html'" class="flex h-20 w-full cursor-pointer items-center justify-center overflow-hidden rounded-full bg-primary px-8 text-white shadow-lg active:scale-95 transition-transform duration-100">
                <div class="flex items-center gap-4">
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/20">
                        <span class="material-symbols-outlined text-3xl">play_circle</span>
                    </div>
                    <span class="text-2xl font-extrabold tracking-wide uppercase">Continue</span>
                </div>
            </button>
        </div>
        <div class="mt-12 opacity-20">

        </div>
    </main>
</div>
</body>
</html>
